name: CI Pipeline

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Cityinfo.sln

      - name: Build application
        run: dotnet build Cityinfo.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Cityinfo.sln --configuration Release --no-build
      
      - name: Use Github Secret
        shell: bash
        env: 
          SECRET_NAME: ${{ secrets.SECRET_NAME }} 
        run: |
          if [ -n "$SECRET_NAME" ]; then
           echo "Secret is available to the workflow." 
          else 
           echo "Secret is NOT available." 
           exit 1 
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cityinfo-api-build
          path: |
            **/bin/Release/**